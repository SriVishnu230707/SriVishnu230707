<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc">
<title id="title">Project pulse</title>
<desc id="desc">The four most recently pushed original public repositories. Bars show freshness over the last 30 days. Updated 2026-10-30 22:27 UTC.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171d23"/><stop offset="1" stop-color="#29333d"/></linearGradient>
  <style>
    .heading{font:700 24px Arial,sans-serif;fill:#f1f5f9}
    .subtitle,.date,.age,.footer{font:12px Arial,sans-serif;fill:#a7b3c0}
    .project{font:15px Arial,sans-serif;fill:#e2e8f0}
    .scan{animation:scan 7s linear infinite}
    @keyframes scan{0%{transform:translateX(0)}100%{transform:translateX(1000px)}}
    @media (prefers-reduced-motion:reduce){.scan{animation:none}}
  </style>
</defs>
<rect width="1100" height="310" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="1098" height="308" rx="21" fill="none" stroke="#475563"/>
<text x="36" y="42" class="heading">PROJECT PULSE</text>
<text x="36" y="63" class="subtitle">Latest pushes across original public repositories</text>
<path d="M36 73H1064" stroke="#64748b"/>
<rect x="36" y="80" width="2" height="183" fill="#cbd5e1" opacity=".2" class="scan"/>
<g>
    <circle cx="43" cy="98" r="5" fill="#cbd5e1"/>
    <text x="59" y="103" class="project">mplads-sentinel-ai</text>
    <rect x="445" y="90" width="280" height="12" rx="6" fill="#303b46"/>
    <rect x="445" y="90" width="280" height="12" rx="6" fill="#cbd5e1"/>
    <text x="755" y="103" class="age">today</text>
    <text x="1048" y="103" text-anchor="end" class="date">2026-10-30</text>
  </g><g>
    <circle cx="43" cy="141" r="5" fill="#aebdca"/>
    <text x="59" y="146" class="project">ticker-room</text>
    <rect x="445" y="133" width="280" height="12" rx="6" fill="#303b46"/>
    <rect x="445" y="133" width="280" height="12" rx="6" fill="#aebdca"/>
    <text x="755" y="146" class="age">today</text>
    <text x="1048" y="146" text-anchor="end" class="date">2026-10-30</text>
  </g><g>
    <circle cx="43" cy="184" r="5" fill="#91a7b8"/>
    <text x="59" y="189" class="project">sri-vishnu-portfolio</text>
    <rect x="445" y="176" width="280" height="12" rx="6" fill="#303b46"/>
    <rect x="445" y="176" width="280" height="12" rx="6" fill="#91a7b8"/>
    <text x="755" y="189" class="age">today</text>
    <text x="1048" y="189" text-anchor="end" class="date">2026-10-30</text>
  </g><g>
    <circle cx="43" cy="227" r="5" fill="#748da2"/>
    <text x="59" y="232" class="project">smart-college-asset-maintenacne</text>
    <rect x="445" y="219" width="280" height="12" rx="6" fill="#303b46"/>
    <rect x="445" y="219" width="271" height="12" rx="6" fill="#748da2"/>
    <text x="755" y="232" class="age">1d ago</text>
    <text x="1048" y="232" text-anchor="end" class="date">2026-10-29</text>
  </g>
<path d="M36 281H1064" stroke="#475563"/>
<text x="36" y="299" class="footer">Bars show freshness within a 30-day window · refreshed every 6 hours</text>
<text x="1064" y="299" text-anchor="end" class="footer">2026-10-30 22:27 UTC</text>
</svg>
