<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" role="img" aria-labelledby="title desc">
  <title id="title">Sri Vishnu</title>
  <desc id="desc">Animated charcoal banner with silver orbits, a moving highlight, and the words building curious things with code.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset=".55" stop-color="#19212a"/><stop offset="1" stop-color="#27313d"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="0"><stop stop-color="#64748b"/><stop offset=".5" stop-color="#cbd5e1"/><stop offset="1" stop-color="#7691a9"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity=".055"/></pattern>
    <clipPath id="name-shimmer"><rect x="-170" y="80" width="115" height="70" class="sweep"/></clipPath>
    <style>
      .orbit { transform-origin: 695px 125px; animation: orbit 16s linear infinite; }
      .orbit-inner { transform-origin: 695px 125px; animation: orbit 9s linear infinite reverse; }
      .sweep { animation: sweep 5s ease-in-out infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .code { animation: glow 3.2s ease-in-out infinite; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes sweep { 0%, 14% { transform: translateX(0); } 72%, 100% { transform: translateX(720px); } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes glow { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) {
        .orbit, .orbit-inner, .sweep, .cursor, .code { animation: none; }
        .cursor { opacity: 0; }
      }
    </style>
  </defs>
  <rect width="800" height="250" rx="20" fill="url(#background)"/>
  <rect width="800" height="250" rx="20" fill="url(#grid)"/>
  <circle cx="695" cy="125" r="88" fill="none" stroke="#94a3b8" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="695" cy="125" r="58" fill="none" stroke="#cbd5e1" stroke-opacity=".55" stroke-width="2"/>
  <circle cx="695" cy="125" r="29" fill="none" stroke="#7691a9" stroke-opacity=".7" stroke-width="2"/>
  <g class="orbit"><circle cx="751" cy="57" r="6" fill="#cbd5e1"/></g>
  <g class="orbit-inner"><circle cx="637" cy="125" r="5" fill="#94a3b8"/></g>
  <path d="M0 221C153 182 290 267 440 212S680 188 800 220" fill="none" stroke="url(#accent)" stroke-opacity=".7" stroke-width="3"/>
  <text x="40" y="62" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4">HELLO, WORLD / I’M</text>
  <text x="38" y="139" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-2">SRI VISHNU</text>
  <text x="38" y="139" fill="#ffffff" opacity=".65" clip-path="url(#name-shimmer)" font-family="Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-2">SRI VISHNU</text>
  <rect x="474" y="88" width="5" height="55" rx="2" fill="#cbd5e1" class="cursor"/>
  <rect x="40" y="156" width="320" height="3" rx="2" fill="url(#accent)"/>
  <text x="40" y="193" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="19">Building curious things with code.</text>
  <text x="668" y="138" fill="#f1f5f9" font-family="Consolas, monospace" font-size="28" font-weight="700" class="code">&lt;/&gt;</text>
</svg>
