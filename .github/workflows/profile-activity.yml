name: Refresh profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Update recently active repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          user = "SriVishnu230707"
          url = f"https://api.github.com/users/{user}/repos?type=owner&sort=pushed&direction=desc&per_page=100"
          headers = {"Accept": "application/vnd.github+json", "User-Agent": "profile-activity-workflow"}
          token = os.environ.get("GITHUB_TOKEN")
          if token:
              headers["Authorization"] = f"Bearer {token}"
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as response:
              repos = json.load(response)

          repos = [repo for repo in repos if repo["name"] != user and not repo["archived"] and repo["size"] > 0]
          repos.sort(key=lambda repo: repo["pushed_at"] or "", reverse=True)
          lines = []
          for repo in repos[:6]:
              name = html.escape(repo["name"])
              language = html.escape(repo["language"] or "Mixed stack")
              pushed = repo["pushed_at"][:16].replace("T", " ") + " UTC"
              lines.append(f"- **[{name}]({repo['html_url']})** · {language} · last pushed {pushed}")
          section = "\n".join(lines) if lines else "No public repositories yet."

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          start = "<!-- RECENT_REPOS_START -->"
          end = "<!-- RECENT_REPOS_END -->"
          pattern = re.compile(re.escape(start) + r".*?" + re.escape(end), re.DOTALL)
          if len(pattern.findall(text)) != 1:
              raise SystemExit("Expected exactly one recent repositories block in README.md")
          updated = pattern.sub(lambda _: f"{start}\n{section}\n{end}", text)
          if updated != text:
              readme.write_text(updated, encoding="utf-8")
          PY
      - name: Commit profile changes
        run: |
          if git diff --quiet -- README.md; then
            echo "Profile activity is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh recent repository activity"
          git push
